name: Build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip realistic-water\ \(1\).zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - run: cd realistic-water && gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: realistic-water
          path: realistic-water/build/libs/realistic-water-1.0.0.jar
